# Build the docs/*.md guides and the mkdocstrings API reference into a
# GitHub Pages site.
#
# Runs on every push to main so the site never drifts from the guides, and
# on demand.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/swift_kg/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; let in-progress production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: docs-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # No extras: every documented module imports only core dependencies, and
      # this package has no extras to begin with. `--with docs` installs the
      # package itself, which is what mkdocstrings resolves `paths: [src]`
      # against.
      - name: Install dependencies
        run: poetry install --no-interaction --with docs

      # Not --strict: docs/*.md cross-links to the top-level README, src/ and
      # tests/, which render on GitHub but have no target inside the built
      # site, and mkdocs treats those as warnings.
      - name: Build
        run: poetry run mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
