# pyproject.toml — SwiftKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with kg            + the pycodekg / dockg CLIs
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Build KG indices (against a Swift repository, not this one)
# ----------------------------------------------------------
#   swiftkg build --repo /path/to/swift-repo     full rebuild (wipes)
#   swiftkg update --repo /path/to/swift-repo    incremental upsert

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "swift_kg", from = "src" }]

[project]
name = "swift-kg"
version = "0.1.0"
description = "Knowledge graph for Swift codebases — AST extraction, hybrid semantic+structural search"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@mac.com" }
]
keywords = ["knowledge-graph", "swift", "ios", "ast", "sqlite-vec", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Swift",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core: tree-sitter AST extraction + CLI skeleton. kgmodule-utils supplies
    # the NodeSpec/EdgeSpec/KGExtractor types the extractor is built on; click
    # drives the swiftkg command group (subcommands lazily import the heavier
    # build/query/mcp pieces below).
    "tree-sitter>=0.25.0",
    # tree-sitter-swift publishes abi3 wheels for macOS arm64/x86_64,
    # manylinux, musllinux and Windows, so indexing a Swift repository needs
    # no Swift toolchain and works on Linux CI as well as on a Mac. That is
    # the whole reason this is a tree-sitter module and not a SourceKit-LSP
    # client: SourceKit would give real type resolution and would require a
    # buildable project and an installed toolchain.
    "tree-sitter-swift>=0.7.0",
    "rich>=14.3.3,<15",
    # 0.20.0 is a hard requirement, not a preference: the snapshot manager's
    # package identity is the `package_name` class attribute there, where it
    # used to be an __init__ that only forwarded to super(). Against 0.19.x
    # every snapshot's `tool` field would read "kg-utils".
    "kgmodule-utils[semantic,sqlite-vec]>=0.20.0",
    "click>=8.1.0,<9",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module
    # (FastMCP was split out into the standalone `fastmcp` package) and rebuilt
    # mcp.server around new submodules. src/swift_kg/mcp_server.py imports
    # FastMCP from mcp, so an unbounded floor lets a clean install pull 2.x and
    # break `swiftkg-mcp` at import time. Lift this only alongside a port to
    # the standalone fastmcp package.
    "mcp>=1.0.0,<2",
    "networkx>=3.0",
]

# ---------------------------------------------------------------------------
# Extras — user-facing features
# ---------------------------------------------------------------------------
# There is deliberately no `viz` / `viz3d` extra yet: the visualizers are not
# in this release, and an extra that installs Streamlit and PyVista for
# commands that only print "not yet available" would be a lie told in wheel
# metadata, where it is hardest to notice. They land together.
#
# pycode-kg is not an extra either: it is never imported by this package, so
# it does not belong in published metadata. It lives in [tool.poetry.group.kg].

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the fleet: 0.16 formats Python inside Markdown
# code blocks as stable behaviour.
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# pycode-kg is a tool this repo *runs*, not a library it imports: PyCodeKG
# indexes this repo's own Python source from the outside, via the `pycodekg`
# CLI in .git/hooks/pre-commit. SwiftKG cannot index itself — this repository
# is Python, and Swift is what it reads.
#
# It belongs in a Poetry group, not `dev`, and the reason is CI weight rather
# than metadata: pycode-kg and doc-kg pull sentence-transformers and torch
# transitively, and `dev` is what every lint, type-check and test job installs.
# The `kg` group is skipped by default precisely so CI can decline it.
#
#   poetry install --with kg      # get the pycodekg CLI into .venv/bin
#   poetry install                # default: group is optional, skipped
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
# Both floors are the releases that retired these packages' own snapshot
# overrides and moved them onto kgmodule-utils>=0.20.0, the same SDK this repo
# requires.
doc-kg = ">=0.26.0"
pycode-kg = ">=0.27.0"

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/swift_kg"
Repository = "https://github.com/Flux-Frontiers/swift_kg"

[project.scripts]
swiftkg                = "swift_kg.cli.main:cli"
swiftkg-analyze        = "swift_kg.cli.cmd_analyze:analyze"
swiftkg-build          = "swift_kg.cli.cmd_build:build"
swiftkg-update         = "swift_kg.cli.cmd_build:update"
swiftkg-build-sqlite   = "swift_kg.cli.cmd_build:build_sqlite"
swiftkg-build-index    = "swift_kg.cli.cmd_build:build_index"
swiftkg-centrality     = "swift_kg.cli.cmd_centrality:centrality"
swiftkg-download-model = "swift_kg.cli.cmd_model:download_model"
swiftkg-init           = "swift_kg.cli.cmd_init:init"
swiftkg-install-hooks  = "swift_kg.cli.cmd_hooks:install_hooks"
swiftkg-query          = "swift_kg.cli.cmd_query:query"
swiftkg-pack           = "swift_kg.cli.cmd_query:pack"
swiftkg-mcp            = "swift_kg.mcp_server:main"

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts   = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests that require real model/sqlite-vec",
]

# Which directories `swiftkg` indexes when pointed at a Swift repository.
# This repository has no Swift in it, so the key is documentation of the
# format rather than configuration that does anything here.
[tool.swiftkg]
# include = ["Sources"]
# exclude = ["Vendor"]

# This repo is Python — PyCodeKG (not SwiftKG) indexes it on commit.
[tool.pycodekg]
include = ["src"]
